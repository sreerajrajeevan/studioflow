name: Flutter CI

# Builds and tests the StudioFlow Flutter app on a supported runner —
# this is where the Android APK build is verified (the dev sandbox cannot
# run Gradle; see docs/TASK1_7_NOTES.md).
on:
  push:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    paths:
      - 'flutter_app/**'

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify code generation is current
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code lib/data/database.g.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test (unit, widget, persistence, goldens)
        run: flutter test

      - name: Set up Gradle (for wrapper regeneration)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Restore binary build files not stored in git
        run: |
          # gradle-wrapper.jar and the launcher icons are binary files
          # that cannot travel the text-only snapshot push, so they are
          # absent from this repo. Regenerate them here, only when
          # missing \u2014 real files in the repo always win. Uses only
          # python3 / curl / unzip, which every ubuntu runner has.
          python3 - <<'PYEOF'
          import struct, zlib, os
          def png(size, rgb=(27, 58, 47)):
              row = bytes(rgb) * size
              raw = b''.join(b'\x00' + row for _ in range(size))
              def chunk(tag, data):
                  return (struct.pack('>I', len(data)) + tag + data +
                          struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff))
              ihdr = struct.pack('>IIBBBBB', size, size, 8, 2, 0, 0, 0)
              return (b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) +
                      chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b''))
          for name, size in [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96),
                             ('xxhdpi', 144), ('xxxhdpi', 192)]:
              path = f'android/app/src/main/res/mipmap-{name}/ic_launcher.png'
              if not os.path.exists(path):
                  # The mipmap-* folders held ONLY these PNGs, so they
                  # do not exist in a git checkout \u2014 create them.
                  os.makedirs(os.path.dirname(path), exist_ok=True)
                  open(path, 'wb').write(png(size))
                  print('generated', path)
          PYEOF
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            if ! command -v gradle >/dev/null 2>&1; then
              echo "gradle not on PATH; downloading Gradle 9.5.0"
              curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.5.0-bin.zip
              unzip -q /tmp/gradle.zip -d /tmp
              export PATH="/tmp/gradle-9.5.0/bin:$PATH"
            fi
            # Generate the wrapper in an EMPTY directory and copy only
            # the jar in. Running `gradle wrapper` inside android/
            # evaluates the Flutter project's build scripts, which fail
            # before the Flutter tool has generated local.properties.
            echo "generating gradle-wrapper.jar in a clean directory"
            mkdir -p /tmp/wrapgen
            # Gradle 9 refuses to run any task, wrapper included, in a
            # directory with no settings file \u2014 give it a minimal one.
            printf "rootProject.name = 'wrapgen'\n" > /tmp/wrapgen/settings.gradle
            (cd /tmp/wrapgen && gradle wrapper --gradle-version 9.5.0)
            cp /tmp/wrapgen/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: studioflow-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk

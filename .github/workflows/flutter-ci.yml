name: Flutter CI

# Builds and tests the StudioFlow Flutter app on a supported runner —
# this is where the Android APK build is verified (the dev sandbox cannot
# run Gradle; see docs/TASK1_7_NOTES.md).
on:
  push:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    paths:
      - 'flutter_app/**'

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify code generation is current
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code lib/data/database.g.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test (unit, widget, persistence, goldens)
        run: flutter test

      - name: Set up Gradle (for wrapper regeneration)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Restore binary build files not stored in git
        run: |
          # gradle-wrapper.jar and the launcher icons are binary files
          # that cannot travel the text-only snapshot push, so they are
          # absent from this repo. Regenerate them here, only when
          # missing — real files in the repo always win.
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            (cd android && gradle wrapper --gradle-version 9.5.0)
          fi
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            f="android/app/src/main/res/mipmap-$1/ic_launcher.png"
            if [ ! -f "$f" ]; then
              convert -size ${2}x${2} xc:"#1B3A2F" "$f"
            fi
          done

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: studioflow-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk

name: studioflow
description: StudioFlow — white-label salon & grooming studio management platform (POS billing, attendance, salary). Demo build for D POISE Groom Studio.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.28
  dio: ^5.7.0
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  pdf: ^3.13.1
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
